<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>视频读取对照</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; background: #10161e; color: #f4f7fb; font-family: "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; align-items: center; }
  header { padding: 16px 24px 8px; width: 100%; text-align: center; flex: 0 0 auto; }
  h1 { margin: 0 0 8px; font-size: clamp(22px, 2.4vw, 36px); }
  p { margin: 6px 0; font-size: clamp(16px, 1.5vw, 24px); }
  #name { color: #b4c9df; overflow-wrap: anywhere; }
  main { width: 100%; flex: 1; min-height: 0; display: flex; justify-content: center; padding: 12px 24px; }
  video { display: block; height: 100%; max-width: 100%; background: #000; object-fit: contain; }
  footer { min-height: 48px; padding: 8px 24px 16px; text-align: center; }
  #start { min-width: 140px; min-height: 48px; font-size: 20px; }
  #message { color: #f8d88b; }
</style>
<header>
  <h1 id="title">视频读取对照</h1>
  <p id="name"></p>
  <p>观察完成后，切回黑色窗口按 Enter 结束本轮记录。</p>
  <p>本页不控制滑轨；视频播完后仍需手动结束采集。</p>
</header>
<main><video id="video" controls controlslist="nofullscreen nodownload noremoteplayback" disablepictureinpicture playsinline preload="auto"></video></main>
<footer><button id="start" hidden>点击开始播放</button><span id="message"></span></footer>
<script src="read-player.js"></script>
</html>
